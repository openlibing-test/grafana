name: gosec-scan

# 场景二：workflow 全量扫描（GitHub Actions 版）
# 参考：openlibing/docs static-code-analysis/.../tools/gosec/demos/github/gosec-scan.yml
# 触发：手动 / push / PR / 定时
# Original triggers preserved; manual-only for test cost control.
# on:
#   workflow_dispatch:
#   push:
#     branches: ["main"]
#   pull_request:
#     branches: ["main"]
#   schedule:
#     - cron: "0 0 * * *" # 5 位 POSIX：每天 00:00 UTC（CST 08:00）
on:
  workflow_dispatch:

# OIDC 免密换证：GitHub 平台使用华为云 IAM 中注册的 GitHubActions 身份提供商，
# 无需配置任何 Secrets；id-token: write 缺失时上传步骤会报
# 「缺少 ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN 环境变量」
permissions:
  contents: read
  id-token: write

concurrency:
  group: gosec-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec-scan-upload:
    name: Gosec 扫描 - SARIF - 上传
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3" # 与 grafana go.mod 对齐
          cache: true

      # 安装与扫描放在同一步，避免 go install 的 PATH 修改无法跨 step 继承
      # 版本说明：文档默认 v2.22.4，但其 go/packages 在 Go 1.27 下会报
      # "package xxx without types"，与 grafana（go 1.27.3）不兼容，因此升到 v2.30.0
      - name: 安装 gosec 并扫描
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -version
          mkdir -p reports
          gosec -no-fail -conf gosec.json -fmt sarif -out reports/gosec.sarif \
            -exclude-dir=vendor -exclude-generated ./...

      - name: Upload SARIF to openLiBing
        if: ${{ always() }}
        uses: openlibing-test/upload-sarif-action@source-platform-detection
        with:
          sarif_file: reports/gosec.sarif
          source_path: .
          env_type: beta # GitHub 接入需回传 beta 环境，否则回调报「非法 source 值」
