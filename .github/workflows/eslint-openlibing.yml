name: ESLint TypeScript scan
on:
  workflow_dispatch:
  push:
    branches: ['codex/grafana-eslint-validation']
permissions:
  contents: read
  id-token: write
jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated ESLint toolchain
        run: npm ci --prefix .github/eslint-validation --ignore-scripts --no-audit --no-fund
      - name: Scan TypeScript
        run: |
          mkdir -p reports
          rm -f reports/eslint.sarif
          set +e
          node .github/eslint-validation/node_modules/eslint/bin/eslint.js 'public/**/*.{ts,tsx}' 'packages/**/*.{ts,tsx}' --config .github/eslint-validation/eslint.config.mjs --format ./.github/eslint-validation/node_modules/@microsoft/eslint-formatter-sarif/sarif.js --output-file reports/eslint.sarif --no-error-on-unmatched-pattern
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          test -s reports/eslint.sarif
          node -e 'const s=JSON.parse(require("fs").readFileSync("reports/eslint.sarif")); console.log(`SARIF ${s.version}: ${s.runs.reduce((n,r)=>n+(r.results||[]).length,0)} results`);'
      - uses: actions/upload-artifact@v4
        with:
          name: grafana-eslint-sarif
          path: reports/eslint.sarif
          if-no-files-found: error
      - name: Upload SARIF to openLiBing
        uses: openlibing-test/upload-sarif-action@source-platform-detection
        with:
          sarif_file: reports/eslint.sarif
          source_path: .
          env_type: beta
          category: grafana-eslint-typescript
