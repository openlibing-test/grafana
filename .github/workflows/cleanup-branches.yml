name: Clean up orphaned branches
# Original triggers preserved; manual-only for test cost control.
# on:
#   workflow_dispatch:
#   schedule:
#     - cron: "0 9 * * 1"
on:
  workflow_dispatch:

jobs:
  cleanup-branches:
    runs-on: ubuntu-arm64-small
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: grafana/shared-workflows/actions/cleanup-branches@cleanup-branches/v0.2.1
        with:
          dry-run: false
          max-date: "1 month ago"
