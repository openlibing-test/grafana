repos:
  - repo: local
    hooks:
      - id: gosec
        name: gosec
        entry: python .github/eslint-validation/scan.py gosec
        language: system
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: eslint
        name: eslint
        entry: python .github/eslint-validation/scan.py eslint
        language: system
        files: ^(public|packages)/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true
